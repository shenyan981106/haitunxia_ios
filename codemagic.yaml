workflows:
  ios-release:
    name: iOS Release
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get

      - name: Apply code signing profiles
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa \
            --release \
            --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa