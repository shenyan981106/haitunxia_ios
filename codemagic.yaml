workflows:
  ios-release:
    name: iOS Release
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.haitunxia.com
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Build iOS archive (no codesign)
        script: |
          flutter build ipa \
            --release \
            --export-method app-store \
            --no-codesign
      - name: Export archive to IPA with distribution certificate
        script: |
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive"
          echo "Archive: $ARCHIVE_PATH"

          # List all available identities for debugging
          echo "=== Available codesigning identities ==="
          security find-identity -v -p codesigning 2>/dev/null
          echo "=========================================="

          # Get the distribution identity name
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep "Apple Distribution" \
            | sed 's/.*"\(.*\)"/\1/' \
            | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "ERROR: No Apple Distribution identity found"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"

          # Get Team ID from the distribution certificate
          TEAM_ID=$(security find-certificate -c "$IDENTITY" -p 2>/dev/null \
            | openssl x509 -noout -subject 2>/dev/null \
            | grep -oE 'OU = [0-9A-Z]{10}' \
            | sed 's/OU = //')
          if [ -z "$TEAM_ID" ]; then
            echo "WARNING: Could not extract Team ID, will try from profile"
            TEAM_ID=$(security find-certificate -c "$IDENTITY" -p 2>/dev/null \
              | openssl x509 -noout -subject 2>/dev/null \
              | grep -oE '[0-9A-Z]{10}')
          fi
          echo "Team ID: $TEAM_ID"

          # Create export options plist
          EXPORT_PLIST="$CM_BUILD_DIR/exportOptions.plist"
          rm -f "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $IDENTITY" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_PLIST"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:app.haitunxia.com string AppStore" "$EXPORT_PLIST"

          echo "Export options plist:"
          cat "$EXPORT_PLIST"

          # Export archive to IPA
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa"
          mkdir -p "$IPA_PATH"
          xcodebuild \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates

          echo "IPA exported successfully"
          ls -la "$IPA_PATH"/*.ipa
    artifacts:
      - build/ios/ipa/*.ipa