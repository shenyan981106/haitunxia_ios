workflows:
  ios-release:
    name: iOS Release
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.haitunxia.com
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Build archive (no codesign)
        script: flutter build ipa --release --no-codesign
      - name: Export IPA with automatic signing
        script: |
          echo "=== Available identities ==="
          security find-identity -v -p codesigning 2>/dev/null

          # Extract Team ID directly from the identity name
          # Identity format: "iPhone Distribution: Company Name (TEAMID)"
          IDENTITY_LINE=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep -E "Distribution|Development" \
            | head -1)
          echo "Identity line: $IDENTITY_LINE"

          TEAM_ID=$(echo "$IDENTITY_LINE" \
            | grep -oE '\([A-Z0-9]+\)' \
            | tr -d '()' \
            | head -1)

          if [ -z "$TEAM_ID" ]; then
            echo "ERROR: Could not extract Team ID from identity name"
            exit 1
          fi
          echo "Team ID: $TEAM_ID"

          # Build export options plist
          EXPORT_PLIST="$CM_BUILD_DIR/exportOptions.plist"
          cat > "$EXPORT_PLIST" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
          </dict>
          </plist>
          EOF

          echo "Export options:"
          cat "$EXPORT_PLIST"

          # Export archive to IPA
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            -allowProvisioningUpdates

          echo "=== IPA export result ==="
          ls -la "$CM_BUILD_DIR/build/ios/ipa/"*.ipa 2>/dev/null || echo "No IPA found"
    artifacts:
      - build/ios/ipa/*.ipa
