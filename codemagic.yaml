workflows:
  ios-release:
    name: iOS Release
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.haitunxia.com
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Build archive (no codesign)
        script: flutter build ipa --release --no-codesign
      - name: Export IPA with manual signing
        script: |
          echo "=== Available identities ==="
          security find-identity -v -p codesigning 2>/dev/null

          # Extract signing identity (full name in quotes)
          IDENTITY_LINE=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep -E "Distribution" \
            | head -1)
          SIGNING_CERT=$(echo "$IDENTITY_LINE" \
            | sed 's/.*"\(.*\)".*/\1/')
          echo "Signing certificate: $SIGNING_CERT"

          # Extract Team ID from identity name (last parenthesized group)
          TEAM_ID=$(echo "$IDENTITY_LINE" \
            | grep -oE '\([A-Z0-9]+\)' \
            | tr -d '()' \
            | tail -1)
          echo "Team ID: $TEAM_ID"

          # Find installed provisioning profile for this bundle id
          echo "=== Looking for provisioning profiles ==="
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          ls -la "$PROFILE_DIR"/*.mobileprovision 2>/dev/null

          PROFILE_NAME=""
          for PROFILE_FILE in "$PROFILE_DIR"/*.mobileprovision; do
            # Decode mobileprovision to a temp plist file
            TEMP_PLIST=$(mktemp)
            security cms -D -i "$PROFILE_FILE" > "$TEMP_PLIST" 2>/dev/null

            # Extract app-identifier and profile name using PlistBuddy
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$TEMP_PLIST" 2>/dev/null || echo "")
            CUR_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$TEMP_PLIST" 2>/dev/null || echo "")
            echo "Profile: name=$CUR_NAME, app-id=$APP_ID"

            rm -f "$TEMP_PLIST"

            if echo "$APP_ID" | grep -q "app.haitunxia.com"; then
              PROFILE_NAME="$CUR_NAME"
              echo "Matched profile name: $PROFILE_NAME"
              break
            fi
          done

          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: No provisioning profile found for app.haitunxia.com"
            exit 1
          fi

          # Build export options plist (manual signing)
          EXPORT_PLIST="$CM_BUILD_DIR/exportOptions.plist"
          cat > "$EXPORT_PLIST" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingCertificate</key>
            <string>$SIGNING_CERT</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.haitunxia.com</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "Export options:"
          cat "$EXPORT_PLIST"

          # Export archive to IPA
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa" \
            -exportOptionsPlist "$EXPORT_PLIST"

          echo "=== IPA export result ==="
          ls -la "$CM_BUILD_DIR/build/ios/ipa/"*.ipa 2>/dev/null || echo "No IPA found"
    artifacts:
      - build/ios/ipa/*.ipa

  ios-dev:
    name: iOS Development
    environment:
      flutter: stable
      ios_signing:
        distribution_type: development
        bundle_identifier: app.haitunxia.com
    scripts:
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Apply code signing profiles
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: flutter build ipa --release --export-method development
    artifacts:
      - build/ios/ipa/*.ipa
